name: Release

# Tag push (e.g. v1.0.1) -> Android APK/AAB + Linux .deb + Windows .msi on GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed APK + AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Linux .deb
        run: ./gradlew :desktopApp:packageReleaseDeb --stacktrace

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktopApp/build/compose/binaries/main-release/deb/*.deb

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows .msi
        shell: pwsh
        run: .\gradlew :desktopApp:packageReleaseMsi --stacktrace

      - name: Upload Windows .msi
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktopApp/build/compose/binaries/main-release/msi/*.msi

  publish:
    needs: [android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p release
          find dist -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.deb' -o -name '*.msi' \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
